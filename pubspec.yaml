name: hermes_conduit_bridge
description: WebSocket client for Hermes Notification Bridge — receives push messages in Conduit
version: 0.1.0
homepage: https://github.com/ScuraUrsa/hermes-conduit-bridge
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  flutter_local_notifications: ^17.0.0
  riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.cogwheel.conduit.bridge
        pluginClass: HermesBridgePlugin
